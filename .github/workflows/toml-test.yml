name: TOML tests

on: push

permissions:
  contents: read

jobs:
  decoder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run TOML 1.1 decoder tests
        run: go run github.com/toml-lang/toml-test/v2/cmd/toml-test@v2.2.0 test -toml=1.1 -decoder 'bash ./parser.sh --toml-test'